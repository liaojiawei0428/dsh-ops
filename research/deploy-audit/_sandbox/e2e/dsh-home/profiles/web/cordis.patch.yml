# deepseek-balance: repoDir/opsDir derive from the sibling layout automatically.
- id: deepseek-balance
  name: 'dsh-deepseek-balance'

# personal-hub managed (plugin; regenerate via personal_hub_reapply)
- id: tool-python
  name: 'dsh-tool-python'
  config:
    pythonPath: 'C:\Users\Administrator\AppData\Local\Python\pythoncore-3.14-64\python.exe'

# plugin-guide: Chinese plugin guide tab in the Plugins settings section.
- id: plugin-guide
  name: 'dsh-plugin-guide'

# restart-resume: auto-continue the session after an AI-triggered service restart.
- id: restart-resume
  name: 'dsh-restart-resume'

# personal-hub managed (extra; regenerate via personal_hub_reapply)
- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  config:
    baseURL: 'https://opencode.ai/zen/go/v1'
    apiKeyEnv: 'OPENCODE_GO_API_KEY'
    model: 'deepseek-v4-flash'

# personal-hub managed (extra; regenerate via personal_hub_reapply)
- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  config:
    pwshPath: 'E:\GongJu\7\pwsh.exe'
